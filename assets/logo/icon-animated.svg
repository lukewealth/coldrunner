<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @keyframes cr-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes cr-orbit {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -12; }
    }
    .cr-center { animation: cr-pulse 3s ease-in-out infinite; }
    .cr-arc { stroke-dasharray: 4 8; animation: cr-orbit 4s linear infinite; }
  </style>
  <circle cx="32" cy="32" r="7" fill="#3B82F6" class="cr-center"/>
  <circle cx="32" cy="13" r="3.5" fill="#3B82F6"/>
  <circle cx="48.5" cy="41.5" r="3.5" fill="#3B82F6"/>
  <circle cx="15.5" cy="41.5" r="3.5" fill="#3B82F6"/>
  <path d="M37 15.5A18 18 0 0 1 46 39" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" class="cr-arc"/>
  <path d="M46 44A18 18 0 0 1 18 44" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" class="cr-arc"/>
  <path d="M18 39A18 18 0 0 1 27 15.5" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" class="cr-arc"/>
</svg>
